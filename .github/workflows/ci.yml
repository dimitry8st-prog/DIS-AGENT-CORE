name: ci

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Workflow unit tests
        run: node --test tests/workflows.test.mjs
      - name: Ingress unit tests
        working-directory: ingress
        run: node --test test/*.test.mjs

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dis_core_test
          POSTGRES_USER: dis
          POSTGRES_PASSWORD: dis_test_only_not_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dis -d dis_core_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Scoped SQL integration
        env:
          DIS_TEST_DATABASE_URL: postgres://dis:dis_test_only_not_prod@127.0.0.1:5432/dis_core_test
        run: node --test tests/sql_scoped.test.mjs

  # Full n8n E2E (import + soft-delete probe) needs the private 2.42.6 image
  # and must NOT run tests/run_cloud.py on shared infrastructure.
  e2e-n8n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Document E2E gate
        run: |
          echo "E2E_N8N status=BLOCKED_without_pinned_private_image"
          echo "Use local: docker compose -f teststand/docker-compose.yml --profile n8n up -d"
          echo "Do NOT run tests/run_cloud.py here (stops Postgres / fault injection)."
          echo "Preserved expected failure: n8n soft-delete retention (docs/CORE_WORKFLOWS_REPORT.md)."
